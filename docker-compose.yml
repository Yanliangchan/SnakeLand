# Local development services. Not used in production (Railway provides Postgres + Redis).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snake
      POSTGRES_PASSWORD: snake
      POSTGRES_DB: snakeland
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  pgdata:
